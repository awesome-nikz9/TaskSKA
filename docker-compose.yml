services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskska
      MYSQL_USER: taskska
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootchangeme}
    volumes:
      - taskska_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootchangeme}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TASKSKA_PROFILE: prod
      PORT: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: taskska
      DB_USER: taskska
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      TASKSKA_JWT_SECRET: ${TASKSKA_JWT_SECRET:-please_change_me_to_a_long_random_secret_value}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@taskska.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SEED_DEMO: ${SEED_DEMO:-false}
      MAIL_CONSOLE_FALLBACK: ${MAIL_CONSOLE_FALLBACK:-true}
    ports:
      - "8080:8080"

volumes:
  taskska_db:
